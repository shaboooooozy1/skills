name: Validate skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install pyyaml pandas openpyxl matplotlib pyflakes
      - name: Validate SKILL.md files and manifests
        run: python scripts/validate_skills.py
      - name: Lint bundled scripts
        run: python -m pyflakes plugins/*/skills/*/scripts/*.py scripts/*.py
      - name: Run script tests on synthetic data
        run: python scripts/test_skill_scripts.py
      - name: Build upload ZIPs
        run: python scripts/package_zips.py
      # Install ZIPs are published only from main. Pull request builds still package (to prove it
      # works) but never upload, so an unreviewed PR cannot replace the install artifact.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: skill-zips
          path: dist/*.zip
